<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* --- FONT SETUP (Classic/Royal Style) --- */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');
        
        body { 
            margin: 0; 
            overflow: hidden; 
            background: transparent; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Cinzel', serif; /* Classic Font */
        }
        
        #alert-box {
            text-align: center; 
            opacity: 0; 
            /* Classic = No Skew, Standard Scaling */
            transform: scale(0.9); 
            transition: all 0.5s ease-in-out;
            
            /* Classic Design: Dark Background + Gold Borders */
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            padding: 40px 60px; 
            
            /* Double Gold Border for "Frame" effect */
            border: 4px double #D4AF37; 
            border-radius: 8px; /* Slightly rounded */
            
            min-width: 500px;
            
            /* Warm Gold Shadow */
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3), inset 0 0 10px rgba(0,0,0,0.8);
        }
        
        #alert-box.show { 
            opacity: 1; 
            transform: scale(1); 
        }
        
        .alert-text { 
            font-size: 32px; 
            color: #f0f0f0; 
            margin: 15px 0 0 0; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            font-weight: 700;
        }
        
        /* The Tipper Name */
        .highlight { 
            color: #D4AF37; /* Gold */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-weight: 900;
            display: block;
            font-size: 40px;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 5px;
        } 
        
        /* The Amount */
        .amount { 
            color: #fff; 
            font-size: 56px; 
            display: block; 
            margin: 15px 0; 
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6); 
            font-weight: 900;
        }
        
        /* The Message */
        .message { 
            font-size: 20px; 
            color: #ccc; 
            margin-top: 20px; 
            font-weight: normal; 
            font-family: 'Lato', sans-serif; /* Clean font for readability */
            font-style: italic;
        }
        
        .alert-image { 
            width: 110px; 
            height: 110px; 
            border: 3px solid #D4AF37; /* Gold Border */
            border-radius: 50%; 
            object-fit: cover; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            background: #000;
        }
    </style>
</head>
<body>
    <div id="alert-box">
        <img id="alert-image" class="alert-image" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExN21keThkanpheXM3Y2lqY3ZwY2hzcHhsbmRkOHhlaWxuMDMxd2luaSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/xTiTnqUxyWbsAXq7Ju/giphy.gif">
        
        <h1 class="alert-text">
            <span id="sender" class="highlight">USER</span> 
            JUST CONTRIBUTED
            <span id="amount" class="amount">500</span>
        </h1>
        
        <p class="message" id="message-text">Message goes here...</p>
    </div>

    <script>
        var socket = io(); 
        var queue = []; 
        var isPlaying = false;
        var availableVoices = [];

        // 1. Force Load Voices
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
            console.log("🎤 Available Voices:", availableVoices.map(v => v.name));
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); 

        // 2. Connection Logic
        var pathParts = window.location.pathname.split('/');
        var uuid = pathParts[pathParts.length - 1]; 
        if (!uuid) uuid = pathParts[pathParts.length - 2];

        if (uuid && uuid !== "overlay") {
            socket.emit('join-overlay', uuid);
        }

        socket.on('new-tip', (data) => { queue.push(data); processQueue(); });

        function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;
            var data = queue.shift();
            showAlert(data);
        }

        function showAlert(data) {
            var senderName = data.tipper || "Anonymous";
            
            // UI Updates
            if(document.getElementById('sender')) document.getElementById('sender').innerText = senderName;
            if(document.getElementById('amount')) document.getElementById('amount').innerText = "₹" + data.amount;
            if(document.getElementById('message-text')) document.getElementById('message-text').innerText = `"${data.message}"`;
            
            var box = document.getElementById('alert-box');
            box.classList.add('show');

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                
                // Clean the text to remove special symbols that might confuse TTS
                var cleanMessage = data.message.replace(/[^a-zA-Z0-9 \u0900-\u097F]/g, ""); 
                var textToSpeak = `${senderName} sent ${data.amount} rupees. ${cleanMessage}`;
                
                var utter = new SpeechSynthesisUtterance(textToSpeak);

                // --- SMART LANGUAGE & VOICE SELECTOR ---
                var hasHindiScript = /[\u0900-\u097F]/.test(data.message);
                var targetVoice = null;

                if (hasHindiScript) {
                    utter.lang = 'hi-IN'; 
                    targetVoice = availableVoices.find(v => v.name.includes('Hemant')) || 
                                  availableVoices.find(v => v.lang.includes('hi'));
                } else {
                    utter.lang = 'en-IN'; 
                    targetVoice = availableVoices.find(v => v.name.includes('Ravi')) || 
                                  availableVoices.find(v => v.name.includes('Mark')) || 
                                  availableVoices.find(v => v.lang.includes('en-IN'));
                }

                if (targetVoice) {
                    utter.voice = targetVoice;
                }

                utter.rate = 1.1; 
                utter.pitch = 1.0;

                utter.onend = () => finishAlert(box);
                utter.onerror = (e) => { console.error("TTS Error:", e); finishAlert(box); };
                
                window.speechSynthesis.speak(utter);
            } else { 
                setTimeout(() => finishAlert(box), 4000); 
            }
        }

        function finishAlert(box) {
            setTimeout(() => { 
                box.classList.remove('show'); 
                setTimeout(() => { isPlaying = false; processQueue(); }, 1000); 
            }, 2000);
        }
    </script>
</body>
</html>
