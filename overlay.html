<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Overlay</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; font-family: 'Montserrat', sans-serif; }
        
        #alert-box {
            display: none; 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 600px;
            z-index: 100;
        }

        .alert-image {
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 5px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            object-fit: cover;
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .alert-text {
            margin-top: 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            animation: slideUp 0.8s ease-out;
        }

        .highlighter { color: #00ff88; font-size: 42px; display: block; margin-bottom: 10px; }
        .message { color: white; font-size: 24px; font-weight: 400; }
        .amount-tag { background: #00ff88; color: black; padding: 5px 15px; border-radius: 20px; font-size: 18px; font-weight: bold; margin-top: 10px; display: inline-block; }

        @keyframes bounceIn { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="alert-box">
        <img id="alert-img" class="alert-image" src="https://media.giphy.com/media/l41lFw057lAJcYFPO/giphy.gif">
        
        <div class="alert-text">
            <span id="alert-name" class="highlighter">NEW TIP!</span>
            <div id="alert-msg" class="message">User sent a tip!</div>
            <div id="alert-amount" class="amount-tag">₹0</div>
        </div>
    </div>

    <audio id="alert-sound" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_12b0c7443c.mp3?filename=success-1-6297.mp3"></audio>

    <script>
        // ⚠️ PASTE YOUR KEYS HERE
        const mySupabaseUrl = 'YOUR_SUPABASE_URL_HERE';
        const mySupabaseKey = 'YOUR_SUPABASE_ANON_KEY_HERE';
        
        const client = window.supabase.createClient(mySupabaseUrl, mySupabaseKey);

        // 1. Get Token from URL (Render passes the token via URL, e.g. /overlay/TOKEN)
        // If your Render route is /overlay/:token, we grab it from the path:
        const pathSegments = window.location.pathname.split('/');
        const token = pathSegments[pathSegments.length - 1]; // Grabs the last part of URL

        if (!token || token === 'overlay') {
             // Fallback: Check query params (?token=...) just in case
             const params = new URLSearchParams(window.location.search);
             if(params.get('token')) {
                 initOverlay(params.get('token'));
             } else {
                 console.error("No Token Found");
             }
        } else {
            initOverlay(token);
        }

        async function initOverlay(obsToken) {
            console.log("Connecting with token:", obsToken);
            
            // 2. Identify the Streamer using the Token
            const { data: user, error } = await client
                .from('users')
                .select('id, logo_url')
                .eq('obs_token', obsToken)
                .single();

            if (error || !user) {
                console.error("Invalid Streamer Token");
                return;
            }

            console.log("Listening for tips to User ID:", user.id);

            // 3. Subscribe to Realtime Events
            client
                .channel('public:tips')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'tips', 
                    filter: `receiver_id=eq.${user.id}` 
                }, (payload) => {
                    console.log("🔔 NEW ALERT!", payload.new);
                    playAlert(payload.new, user.logo_url);
                })
                .subscribe();
        }

        // 4. Play the Animation
        function playAlert(tip, userLogo) {
            const box = document.getElementById('alert-box');
            const audio = document.getElementById('alert-sound');
            
            // Update Text
            document.getElementById('alert-name').innerText = tip.sender_name || "Anonymous";
            document.getElementById('alert-msg').innerText = tip.message || "Sent a tip!";
            document.getElementById('alert-amount').innerText = `₹${tip.amount}`;
            
            // Update Image (Use user logo if available, else keep default gif)
            /* if(userLogo) {
                document.getElementById('alert-img').src = userLogo;
            }
            */

            // Play Sound
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Autoplay blocked:", e));
            
            // Show & Confetti
            box.style.display = 'block';
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

            // Hide after 5 seconds
            setTimeout(() => {
                box.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
