<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; }
        
        #alert-box {
            text-align: center; opacity: 0; transform: scale(0.8);
            transition: all 0.5s;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            border-radius: 15px;
            min-width: 450px;
        }
        #alert-box.show { opacity: 1; transform: scale(1); }
        .alert-text { font-size: 32px; color: #fff; margin: 0; text-transform: uppercase; }
        .highlight { color: #00ffcc; } 
        .amount { color: #ff00ff; font-size: 40px; display: block; margin: 10px 0;}
        .message { font-size: 24px; color: #eee; margin-top: 15px; font-style: italic; border-top: 1px solid #333; padding-top: 15px;}
        .alert-image { width: 120px; height: 120px; border: 3px solid #fff; border-radius: 10px; margin-bottom: 15px; object-fit: cover;}
    </style>
</head>
<body>
    <div id="alert-box">
        <img id="alert-image" src="https://media.giphy.com/media/xUPGGDNsLvqsBOhuU0/giphy.gif" class="alert-image">
        <h1 class="alert-text"><span id="sender" class="highlight">USER</span> <br> DONATED <br> <span id="amount" class="amount">500</span></h1>
        <p class="message" id="message-text">Message goes here...</p>
    </div>

    <script>
        // 1. CONNECT (Using 'var' to prevent crashes)
        var socket = io(); 
        var queue = [];
        var isPlaying = false;

        // 2. GET UUID FROM URL
        var pathParts = window.location.pathname.split('/');
        var uuid = pathParts[pathParts.length - 1]; 

        if (uuid && uuid !== "overlay") {
            console.log("✅ Joining Overlay Room:", uuid);
            socket.emit('join-overlay', uuid);
        } else {
            console.error("❌ No UUID found");
        }

        // 3. LISTEN
        socket.on('new-tip', (data) => {
            console.log("🔔 Tip:", data);
            queue.push(data);
            processQueue();
        });

        function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;
            var data = queue.shift();
            showAlert(data);
        }

        function showAlert(data) {
            var senderName = data.tipper || data.sender || data.username || "Anonymous";
            document.getElementById('sender').innerText = senderName;
            document.getElementById('amount').innerText = "₹" + data.amount;
            document.getElementById('message-text').innerText = `"${data.message}"`;

            var box = document.getElementById('alert-box');
            box.classList.add('show');

            // TTS
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                var utter = new SpeechSynthesisUtterance(`${senderName} sent ${data.amount}. ${data.message}`);
                var voices = window.speechSynthesis.getVoices();
                utter.voice = voices.find(v => v.lang.includes('en-IN')) || voices[0];
                utter.onend = () => { finishAlert(box); };
                utter.onerror = () => { finishAlert(box); };
                window.speechSynthesis.speak(utter);
            } else {
                setTimeout(() => { finishAlert(box); }, 4000);
            }
        }

        function finishAlert(box) {
            setTimeout(() => {
                box.classList.remove('show');
                setTimeout(() => { isPlaying = false; processQueue(); }, 1000);
            }, 2000);
        }
    </script>
</body>
</html>
