<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Hind:wght@600&display=swap'); /* For Hindi Text */
        
        body { margin: 0; overflow: hidden; background: transparent; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', 'Hind', sans-serif; }
        
        #alert-box {
            text-align: center; opacity: 0; transform: scale(0.8); transition: all 0.5s;
            background: rgba(0, 0, 0, 0.85); padding: 30px; border: 2px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc; border-radius: 15px; min-width: 450px;
        }
        #alert-box.show { opacity: 1; transform: scale(1); }
        .alert-text { font-size: 32px; color: #fff; margin: 0; text-transform: uppercase; }
        .highlight { color: #00ffcc; } 
        .amount { color: #ff00ff; font-size: 40px; display: block; margin: 10px 0;}
        .message { font-size: 24px; color: #eee; margin-top: 15px; font-style: italic; border-top: 1px solid #333; padding-top: 15px;}
        .alert-image { width: 120px; height: 120px; border: 3px solid #fff; border-radius: 10px; margin-bottom: 15px; object-fit: cover;}
    </style>
</head>
<body>
    <div id="alert-box">
        <img id="alert-image" src="https://media.giphy.com/media/xUPGGDNsLvqsBOhuU0/giphy.gif">
        <h1 class="alert-text"><span id="sender" class="highlight">USER</span> <br> DONATED <br> <span id="amount" class="amount">500</span></h1>
        <p class="message" id="message-text">Message goes here...</p>
    </div>

    <script>
        var socket = io(); 
        var queue = []; 
        var isPlaying = false;
        
        // 1. Force load voices immediately
        var availableVoices = [];
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
            console.log("🎤 Loaded " + availableVoices.length + " voices.");
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); // Try loading immediately too

        // 2. Connection Logic
        var pathParts = window.location.pathname.split('/');
        var uuid = pathParts[pathParts.length - 1]; 
        if (!uuid) uuid = pathParts[pathParts.length - 2];

        if (uuid && uuid !== "overlay") {
            console.log("✅ Joining:", uuid);
            socket.emit('join-overlay', uuid);
        }

        socket.on('new-tip', (data) => { queue.push(data); processQueue(); });

        function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;
            var data = queue.shift();
            showAlert(data);
        }

        function showAlert(data) {
            var senderName = data.tipper || "Anonymous";
            document.getElementById('sender').innerText = senderName;
            document.getElementById('amount').innerText = "₹" + data.amount;
            
            var msgElement = document.getElementById('message-text');
            if(msgElement) msgElement.innerText = `"${data.message}"`;
            
            var box = document.getElementById('alert-box');
            box.classList.add('show');

            // --- ⚠️ SMART TTS ENGINE ⚠️ ---
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                
                // Full sentence to speak
                var textToSpeak = `${senderName} sent ${data.amount}. ${data.message}`;
                var utter = new SpeechSynthesisUtterance(textToSpeak);

                // A. DETECT LANGUAGE (Is there Hindi Script?)
                // Checks for Devanagari characters (नमस्ते)
                var hasHindiScript = /[\u0900-\u097F]/.test(data.message);

                // B. SELECT VOICE BASED ON SCRIPT
                var targetVoice = null;

                if (hasHindiScript) {
                    // If message has Hindi characters, FORCE a Hindi Voice
                    console.log("🛑 Detected Hindi Script: Searching for Hindi Voice...");
                    targetVoice = availableVoices.find(v => v.lang.includes('hi') || v.name.includes('Hindi'));
                } else {
                    // If English/Hinglish, prefer Indian English
                    console.log("🟢 Detected English/Hinglish: Searching for Indian English...");
                    targetVoice = availableVoices.find(v => v.lang.includes('en-IN') || v.name.includes('India'));
                }

                // Fallback to ANY voice if specific one fails
                if (!targetVoice) targetVoice = availableVoices[0];

                if (targetVoice) {
                    console.log("🗣️ Speaking with:", targetVoice.name);
                    utter.voice = targetVoice;
                }

                // C. SETTINGS
                utter.rate = 0.9;  // Slightly slower is clearer
                utter.pitch = 1.0;

                utter.onend = () => finishAlert(box);
                utter.onerror = (e) => { console.error("TTS Error:", e); finishAlert(box); };
                
                window.speechSynthesis.speak(utter);
            } else { 
                setTimeout(() => finishAlert(box), 4000); 
            }
        }

        function finishAlert(box) {
            setTimeout(() => { 
                box.classList.remove('show'); 
                setTimeout(() => { isPlaying = false; processQueue(); }, 1000); 
            }, 2000);
        }
    </script>
</body>
</html>
