<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Overlay</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
        
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: transparent; height: 100vh; 
            display: flex; align-items: center; justify-content: center; 
            font-family: 'Orbitron', sans-serif; 
        }
        
        #alert-box {
            text-align: center; opacity: 0; transform: scale(0.8);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc, inset 0 0 20px #00ffcc;
            border-radius: 15px;
            min-width: 450px;
            max-width: 600px;
        }
        
        #alert-box.show { opacity: 1; transform: scale(1); }
        
        .alert-image { 
            width: 120px; height: 120px; 
            border: 3px solid #fff; border-radius: 10px; 
            object-fit: cover; margin-bottom: 15px; 
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        
        .alert-text { 
            font-size: 32px; color: #fff; margin: 0; 
            text-transform: uppercase; letter-spacing: 2px; line-height: 1.2;
        }
        
        .highlight { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        .amount { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; font-size: 40px; display: block; margin: 10px 0;}
        
        .message { 
            font-size: 24px; color: #eee; margin-top: 15px; 
            font-family: sans-serif; font-style: italic;
            border-top: 1px solid #333; padding-top: 15px;
        }
    </style>
</head>
<body>

    <div id="alert-box">
        <img id="alert-image" src="https://media.giphy.com/media/xUPGGDNsLvqsBOhuU0/giphy.gif" class="alert-image">
        
        <h1 class="alert-text">
            <span id="sender" class="highlight">USER</span> <br> 
            DONATED <br> 
            <span id="amount" class="amount">500</span>
        </h1>
        
        <p class="message" id="message-text">Message goes here...</p>
    </div>

    <script>
        // -------------------------------------------------
        // 1. CONFIGURATION
        // -------------------------------------------------
        // ✅ UPDATED: Now pointing to your custom domain
        const socket = io("https://app.xdfun.in"); 
        
        const queue = [];
        let isPlaying = false;
        let currentUtterance = null; 

        // -------------------------------------------------
        // 2. CONNECT TO ROOM
        // -------------------------------------------------
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('u'); 

        if(username) {
            console.log("Listening for tips for:", username);
            socket.emit('join', username); 
        } else {
            console.error("No username provided! Use ?u=YOUR_NAME");
        }
        
        // Debugging: Check if connection works
        socket.on("connect", () => {
            console.log("✅ Connected to app.xdfun.in successfully!");
        });
        socket.on("connect_error", (err) => {
            console.error("❌ Connection failed. Check if app.xdfun.in is online.", err);
        });

        // -------------------------------------------------
        // 3. HANDLE INCOMING TIPS
        // -------------------------------------------------
        socket.on('new-tip', (data) => {
            console.log("New Tip:", data);
            queue.push(data);
            processQueue();
        });

        function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;
            
            const data = queue.shift();
            showAlert(data);
        }

        function showAlert(data) {
            // A. UPDATE VISUALS
            document.getElementById('sender').innerText = data.tipper || "Anonymous";
            document.getElementById('amount').innerText = "₹" + data.amount;
            document.getElementById('message-text').innerText = `"${data.message}"`;
            
            // B. SHOW BOX
            const box = document.getElementById('alert-box');
            box.classList.add('show');

            // C. PLAY AUDIO (TTS)
            const speechText = `${data.tipper} sent ${data.amount} rupees. ${data.message}`;

            speakText(speechText, () => {
                setTimeout(() => {
                    box.classList.remove('show');
                    setTimeout(() => {
                        isPlaying = false;
                        processQueue(); 
                    }, 1000); 
                }, 2000); 
            });
        }

        // -------------------------------------------------
        // 4. TTS FUNCTION
        // -------------------------------------------------
        function speakText(text, callback) {
            if (!window.speechSynthesis) return callback();

            window.speechSynthesis.cancel();
            currentUtterance = new SpeechSynthesisUtterance(text);
            
            const voices = window.speechSynthesis.getVoices();
            const targetVoice = voices.find(v => v.lang.includes('en-IN')) || 
                                voices.find(v => v.lang.includes('hi-IN')) || 
                                voices.find(v => v.lang.includes('en-US'));

            if (targetVoice) currentUtterance.voice = targetVoice;
            
            currentUtterance.onend = function() { currentUtterance = null; callback(); };
            currentUtterance.onerror = function() { currentUtterance = null; callback(); };

            window.speechSynthesis.speak(currentUtterance);
        }
        
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    </script>
</body>
</html>
