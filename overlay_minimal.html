<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimal Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@500;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Hind:wght@500&display=swap');
        
        body { margin: 0; overflow: hidden; background: transparent; height: 100vh; display: flex; align-items: flex-end; justify-content: center; font-family: 'Roboto', 'Hind', sans-serif; padding-bottom: 50px; }
        
        #alert-box {
            display: flex; align-items: center; gap: 20px;
            opacity: 0; transform: translateY(50px); transition: all 0.5s ease-out;
            background: rgba(255, 255, 255, 0.95); padding: 15px 30px; 
            border-left: 10px solid #2ecc71; border-radius: 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        #alert-box.show { opacity: 1; transform: translateY(0); }
        
        .alert-text { font-size: 28px; color: #222; margin: 0; font-weight: 900; }
        .highlight { color: #2ecc71; } 
        .amount { color: #27ae60; background: #eafff2; padding: 2px 10px; border-radius: 10px; }
        .message { font-size: 20px; color: #555; margin: 0; font-weight: 500; border-left: 2px solid #ddd; padding-left: 15px; }
    </style>
</head>
<body>
    <div id="alert-box">
        <h1 class="alert-text">
            <span id="sender" class="highlight">USER</span> 
            <span style="font-size: 20px; color:#888;">tipped</span> 
            <span id="amount" class="amount">500</span>
        </h1>
        <p class="message" id="message-text">Message goes here...</p>
    </div>

    <script>
        var socket = io(); 
        var queue = []; 
        var isPlaying = false;
        var availableVoices = [];

        // 1. Force Load Voices
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
            // Debug: Print all available voices to console so you can check them
            console.log("🎤 Available Voices:", availableVoices.map(v => v.name));
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); 

        // 2. Connection Logic
        var pathParts = window.location.pathname.split('/');
        var uuid = pathParts[pathParts.length - 1]; 
        if (!uuid) uuid = pathParts[pathParts.length - 2];

        if (uuid && uuid !== "overlay") {
            socket.emit('join-overlay', uuid);
        }

        socket.on('new-tip', (data) => { queue.push(data); processQueue(); });

        function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;
            var data = queue.shift();
            showAlert(data);
        }

        function showAlert(data) {
            var senderName = data.tipper || "Anonymous";
            document.getElementById('sender').innerText = senderName;
            document.getElementById('amount').innerText = "₹" + data.amount;
            if(document.getElementById('message-text')) {
                document.getElementById('message-text').innerText = `"${data.message}"`;
            }
            
            var box = document.getElementById('alert-box');
            box.classList.add('show');

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                var textToSpeak = `${senderName} sent ${data.amount}. ${data.message}`;
                var utter = new SpeechSynthesisUtterance(textToSpeak);

                // --- ⚠️ MALE VOICE SELECTOR ⚠️ ---
                
                // 1. Check for Hindi Script (Devanagari)
                var hasHindiScript = /[\u0900-\u097F]/.test(data.message);
                var targetVoice = null;

                if (hasHindiScript) {
                    // HINDI: Try 'Hemant' (Male) first, then any Hindi
                    targetVoice = availableVoices.find(v => v.name.includes('Hemant')) || 
                                  availableVoices.find(v => v.name.includes('Hindi') && v.name.includes('Male')) ||
                                  availableVoices.find(v => v.lang.includes('hi'));
                } else {
                    // HINGLISH: Try 'Ravi' (Male) first
                    targetVoice = availableVoices.find(v => v.name.includes('Ravi')) || 
                                  availableVoices.find(v => v.name.includes('Mark')) ||  // Fallback to US Male
                                  availableVoices.find(v => v.name.includes('David')) || // Fallback to US Male
                                  availableVoices.find(v => v.lang.includes('en-IN'));   // Fallback to any Indian English
                }

                if (targetVoice) {
                    console.log("🗣️ Speaking with:", targetVoice.name);
                    utter.voice = targetVoice;
                }

                // Settings
                utter.rate = 1.0; 
                utter.pitch = 0.9; // Slightly lower pitch for more masculine tone

                utter.onend = () => finishAlert(box);
                utter.onerror = () => finishAlert(box);
                window.speechSynthesis.speak(utter);
            } else { 
                setTimeout(() => finishAlert(box), 4000); 
            }
        }

        function finishAlert(box) {
            setTimeout(() => { 
                box.classList.remove('show'); 
                setTimeout(() => { isPlaying = false; processQueue(); }, 1000); 
            }, 2000);
        }
    </script>
</body>
</html>
