<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>FROST Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* --- FONT SETUP --- */
        @font-face {
            font-family: 'Conthey';
            src: url('Conthey-Medium-Nar-3.woff2') format('woff2'),
                 url('Conthey-Medium-Nar-3.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        
        body { 
            margin: 0; 
            overflow: hidden; 
            background: transparent; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Conthey', sans-serif; /* Applied new font */
        }
        
        /* --- LAYOUT CONTAINER --- */
        #alert-box {
            text-align: center; 
            opacity: 0; 
            transform: scale(0.9); 
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            background: transparent;
            padding: 20px; 
            min-width: 500px;
            border: none;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #alert-box.show { opacity: 1; transform: scale(1); }
        
        .alert-video { 
            height: 250px; 
            width: auto; 
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3)); /* Subtle Gold Glow */
            margin-bottom: 10px;
            object-fit: contain;
        }

        /* --- TYPOGRAPHY (All Golden) --- */
        .alert-text { 
            font-size: 32px; 
            color: #FFD700; /* Gold */
            margin-top: -200px; 
            position: relative;
            z-index: 2; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            /* Gold Shadow */
            text-shadow: 2px 2px 4px #000, 0 0 10px rgba(212, 175, 55, 0.6);
        }
        
        /* 1. USER: Golden */
        #sender { 
            color: #FFD700; 
            font-size: 52px;
            display: block;
            margin-bottom: 0px;
            /* Golden Glow + Black Outline */
            text-shadow: 0 0 25px #D4AF37, 3px 3px 0 #000;
        } 
        
        /* Helper Text: Light Gold */
        .sub-text {
            font-size: 22px;
            color: #FFFACD; 
            vertical-align: middle;
            margin: 0 10px;
            text-shadow: 2px 2px 0 #000;
        }
        
        /* 2. AMOUNT: Bright Gold */
        #amount { 
            color: #FFD700; 
            font-size: 60px; 
            display: inline-block;
            text-shadow: 0 0 25px #FFD700, 3px 3px 0 #000;
        }
        
        /* 3. MESSAGE: Golden White */
        .message { 
            font-size: 30px; 
            color: #FFFACD; 
            margin-top: 15px; 
            font-weight: normal; 
            text-shadow: 2px 2px 4px #000, 0 0 12px rgba(212, 175, 55, 0.5);
            max-width: 650px;
            line-height: 1.4;
        }

    </style>
</head>
<body>

    <div id="alert-box">
        <video id="alert-video" class="alert-video" autoplay loop muted playsinline>
            <source src="https://cdn.streamelements.com/widgets-cms/uploads/c2a7c2b8-2ee1-46ea-9507-b8355d56995d.webm?_meta=eyJzaGFyZWRNZWRpYUl0ZW1JZCI6ImFmYjg3NjE0LTM1ZGEtNGFhZi1hYjY4LWYxNWIwMjMxNDhkMCJ9" type="video/webm">
        </video>
        
        <div class="alert-text">
            <span id="sender">USER</span>
            <div>
                <span class="sub-text">Sent</span>
                <span id="amount">₹500</span>
            </div>
        </div>

        <p class="message" id="message-text">Message goes here...</p>
    </div>

    <script>
        var socket = io(); 
        var queue = []; 
        var isPlaying = false;

        var pathParts = window.location.pathname.split('/');
        var uuid = pathParts[pathParts.length - 1]; 
        if (!uuid) uuid = pathParts[pathParts.length - 2];

        if (uuid && uuid !== "overlay") { socket.emit('join-overlay', uuid); }

        socket.on('new-tip', (data) => { queue.push(data); processQueue(); });

        function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;
            var data = queue.shift();
            showAlert(data);
        }

        function showAlert(data) {
            var senderName = data.tipper || "Anonymous";
            var messageText = data.message || "Thank you for the support!";

            document.getElementById('sender').innerText = senderName;
            document.getElementById('amount').innerText = "₹" + data.amount;
            document.getElementById('message-text').innerText = `"${messageText}"`;
            
            var box = document.getElementById('alert-box');
            box.classList.add('show');

            // --- TTS LOGIC ---
            var fullText = `${senderName} sent ${data.amount} rupees. ${messageText}`;
            var hasHindiScript = /[\u0900-\u097F]/.test(fullText);
            var lang = hasHindiScript ? 'hi' : 'en'; 
            
            var safeText = encodeURIComponent(fullText.substring(0, 200)); 
            var audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${safeText}&tl=${lang}&total=1&idx=0&textlen=${safeText.length}&client=tw-ob&prev=input&ttsspeed=1`;

            var audio = new Audio(audioUrl);
            audio.onended = () => finishAlert(box);
            audio.onerror = () => setTimeout(() => finishAlert(box), 5000); 

            audio.play().catch(e => {
                setTimeout(() => finishAlert(box), 5000);
            });
        }

        function finishAlert(box) {
            setTimeout(() => { 
                box.classList.remove('show'); 
                setTimeout(() => { 
                    isPlaying = false; 
                    processQueue(); 
                }, 1000); 
            }, 2000);
        }
    </script>
</body>
</html>
