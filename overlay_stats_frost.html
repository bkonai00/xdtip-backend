<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VIP Gold Stats - Animated</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
        
        body { 
            margin: 0; padding: 20px; 
            overflow: hidden; 
            background: transparent; 
            font-family: 'Montserrat', sans-serif; 
        }

        #vip-container {
            width: 550px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- THE ANIMATED BAR CONTAINER --- */
        .stat-bar {
            position: relative;
            height: 60px;
            background: #000;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: white;
            overflow: hidden; /* Clips the rotating border */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* --- THE CIRCULAR BORDER ANIMATION --- */
        /* This creates the grey "snake" rotating around the edge */
        .stat-bar::before {
            content: '';
            position: absolute;
            width: 150%;  /* Extra wide to cover corners while rotating */
            height: 400%; /* Extra tall to cover corners while rotating */
            background: conic-gradient(
                transparent, 
                transparent, 
                transparent, 
                #A9A9A9 /* Grey Color */
            );
            animation: rotateBorder 4s linear infinite;
            top: -150%;
            left: -25%;
        }

        /* The "Inner" box that covers the rotating gradient to create a thin border look */
        .stat-bar::after {
            content: '';
            position: absolute;
            inset: 3px; /* This controls border thickness (3px) */
            background: #0d0d0d; /* Dark background color */
            border-radius: 8px;
            z-index: 0;
        }

        @keyframes rotateBorder {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- CONTENT WRAPPER --- */
        /* Higher z-index to stay above the border layers */
        .bar-content {
            position: relative;
            z-index: 10;
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
        }

        .label-text {
            font-size: 18px;
            font-weight: 700;
            color: #A9A9A9; /* Grey Label */
            text-transform: uppercase;
        }

        .value-text {
            font-size: 22px;
            font-weight: 900;
            color: #39FF14; /* Neon Green / Gold */
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
            text-transform: uppercase;
        }

        .crown { font-size: 22px; margin-left: 8px; }

        /* Animation Classes for text rotation */
        .fade-in { animation: fadeIn 0.5s forwards; }
        .fade-out { animation: fadeOut 0.5s forwards; }

        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-10px); } }

    </style>
</head>
<body>

    <div id="vip-container">
        
        <div class="stat-bar">
            <div class="bar-content">
                <span class="label-text">#1 XDTIPPER</span>
                <div>
                    <span id="top-one-name" class="value-text">LOADING...</span>
                    <span class="crown">👑</span>
                </div>
            </div>
        </div>

        <div class="stat-bar">
            <div class="bar-content">
                <span class="label-text">TOP TIPS</span>
                <span id="rotating-text" class="value-text">WAITING...</span>
            </div>
        </div>

    </div>

    <script>
        var socket = io(); 
        var topTippers = [];
        var currentIndex = 0;
        
        var pathParts = window.location.pathname.split('/');
        var uuid = pathParts[pathParts.length - 1]; 

        if (uuid) {
            socket.emit('join-overlay', uuid);
            fetchStats();
        }

        async function fetchStats() {
            try {
                const res = await fetch(`/stats/${uuid}`);
                const data = await res.json();
                topTippers = data.top; 
                updateDisplay();
            } catch(e) { console.error("Stats Error:", e); }
        }

        function updateDisplay() {
            if (!topTippers || topTippers.length === 0) {
                document.getElementById('top-one-name').innerText = "NO DATA";
                document.getElementById('rotating-text').innerText = "BE THE FIRST!";
                return;
            }

            var numberOne = topTippers[0];
            document.getElementById('top-one-name').innerText = `${numberOne.sender_name} - ₹${numberOne.amount}`;

            if (window.rotatorInterval) clearInterval(window.rotatorInterval);
            rotateBottomBar();
            window.rotatorInterval = setInterval(rotateBottomBar, 4000); 
        }

        function rotateBottomBar() {
            if (topTippers.length === 0) return;
            var el = document.getElementById('rotating-text');
            
            el.classList.remove('fade-in');
            el.classList.add('fade-out');

            setTimeout(() => {
                var tipper = topTippers[currentIndex];
                el.innerText = `${tipper.sender_name} - ₹${tipper.amount}`;
                el.classList.remove('fade-out');
                el.classList.add('fade-in');

                currentIndex = (currentIndex + 1) % topTippers.length;
            }, 500);
        }

        socket.on('new-tip', () => fetchStats());
    </script>
</body>
</html>
