<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>basicgamerz Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* --- FONT SETUP --- */
        @font-face {
            font-family: 'Knocky';
            src: url('Knocky-SemiBold.woff2') format('woff2'),
                 url('Knocky-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }
        
        body { 
            margin: 0; 
            overflow: hidden; 
            background: transparent; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Knocky', sans-serif;
        }
        
        /* --- LAYOUT CONTAINER --- */
        #alert-box {
            text-align: center; 
            opacity: 0; 
            transform: scale(0.9); 
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            
            /* TRANSPARENT BACKGROUND - NO BOX */
            background: transparent;
            padding: 20px; 
            min-width: 500px;
            
            /* No Border around the container */
            border: none;
            box-shadow: none;
            
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #alert-box.show { opacity: 1; transform: scale(1); }
        
        /* --- GIF STYLE (Full, No Round Border) --- */
        .alert-image { 
            /* Adjustable size - keeps aspect ratio */
            height: 150px; 
            width: auto; 
            
            /* REMOVED CIRCLE & BORDER */
            border-radius: 0; 
            border: none;
            
            /* Shadow to make the GIF pop */
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
            
            margin-bottom: 10px;
            object-fit: contain; /* Shows full image */
        }

        /* --- TYPOGRAPHY --- */
        .alert-text { 
            font-size: 32px; 
            color: #fff; 
            margin: 5px 0; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            /* Strong Shadow for readability on transparent bg */
            text-shadow: 2px 2px 4px #000, 0 0 10px rgba(0,0,0,0.8);
        }
        
        /* 1. USER: Neon Red */
        #sender { 
            color: #FF0039; 
            font-size: 48px;
            display: block;
            margin-bottom: 0px;
            /* Neon Glow + Black Outline */
            text-shadow: 0 0 20px #FF0039, 3px 3px 0 #000;
        } 
        
        /* Helper Text */
        .sub-text {
            font-size: 20px;
            color: #ddd;
            vertical-align: middle;
            margin: 0 10px;
            text-shadow: 2px 2px 0 #000;
        }
        
        /* 2. AMOUNT: Bright Green */
        #amount { 
            color: #00FF00; 
            font-size: 55px; 
            display: inline-block;
            /* Neon Glow + Black Outline */
            text-shadow: 0 0 20px #00FF00, 3px 3px 0 #000;
        }
        
        /* 3. MESSAGE: Bright White */
        .message { 
            font-size: 28px; 
            color: #FFFFFF; 
            margin-top: 15px; 
            font-weight: normal; 
            /* Heavy Shadow for visibility */
            text-shadow: 2px 2px 4px #000, 0 0 10px #000;
            max-width: 600px;
            line-height: 1.4;
        }

    </style>
</head>
<body>

    <div id="alert-box">
        <img id="alert-image" class="alert-image" src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pnaGo1dmYwaTJ4aXVtYjFhZm5jd3RzNTViMmgwdzFiejc3MjZoaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26gsjCZpPolPr3sBy/giphy.gif">
        
        <div class="alert-text">
            <span id="sender">USER</span>
            <div>
                <span class="sub-text">Send</span>
                <span id="amount">₹500</span>
            </div>
        </div>

        <p class="message" id="message-text">Message goes here...</p>
    </div>

    <script>
        var socket = io(); var queue = []; var isPlaying = false;
        var availableVoices = [];

        function loadVoices() { availableVoices = window.speechSynthesis.getVoices(); }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); 

        var pathParts = window.location.pathname.split('/');
        var uuid = pathParts[pathParts.length - 1]; 
        if (!uuid) uuid = pathParts[pathParts.length - 2];

        if (uuid && uuid !== "overlay") { socket.emit('join-overlay', uuid); }

        socket.on('new-tip', (data) => { queue.push(data); processQueue(); });

        function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;
            var data = queue.shift();
            showAlert(data);
        }

        function showAlert(data) {
            var senderName = data.tipper || "Anonymous";
            document.getElementById('sender').innerText = senderName;
            document.getElementById('amount').innerText = "₹" + data.amount;
            document.getElementById('message-text').innerText = `"${data.message}"`;
            
            var box = document.getElementById('alert-box');
            box.classList.add('show');

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                
                // Uses raw message (emojis allowed)
                var messageToSpeak = data.message; 
                
                var utter = new SpeechSynthesisUtterance(`${senderName} sent ${data.amount} rupees. ${messageToSpeak}`);
                
                // Detect Hindi characters to switch voice accent
                var hasHindiScript = /[\u0900-\u097F]/.test(data.message);
                var targetVoice = null;

                if (hasHindiScript) {
                    utter.lang = 'hi-IN'; 
                    targetVoice = availableVoices.find(v => v.name.includes('Hemant')) || availableVoices.find(v => v.lang.includes('hi'));
                } else {
                    utter.lang = 'en-IN'; 
                    targetVoice = availableVoices.find(v => v.name.includes('Ravi')) || availableVoices.find(v => v.lang.includes('en-IN'));
                }
                if (targetVoice) utter.voice = targetVoice;

                utter.onend = () => finishAlert(box);
                utter.onerror = () => finishAlert(box);
                window.speechSynthesis.speak(utter);
            } else { setTimeout(() => finishAlert(box), 4000); }
        }
        function finishAlert(box) {
            setTimeout(() => { box.classList.remove('show'); setTimeout(() => { isPlaying = false; processQueue(); }, 1000); }, 2000);
        }
    </script>
</body>
</html>
