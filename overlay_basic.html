<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* --- FONT SETUP --- */
        @font-face {
            font-family: 'Knocky';
            src: url('Knocky-SemiBold.woff2') format('woff2'),
                 url('Knocky-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }
        
        body { 
            margin: 0; 
            overflow: hidden; 
            background: transparent; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Knocky', sans-serif;
        }
        
        #alert-box {
            text-align: center; 
            opacity: 0; 
            transform: skewX(-10deg) scale(0.8); 
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            background: rgba(0, 0, 0, 0.95); 
            padding: 40px; 
            /* Border matches the primary Red theme */
            border: 4px solid #FF0039;
            box-shadow: 0 0 30px rgba(255, 0, 57, 0.5), inset 0 0 20px rgba(255, 0, 57, 0.2); 
            border-radius: 0px; 
            min-width: 500px;
        }
        
        #alert-box.show { opacity: 1; transform: skewX(-10deg) scale(1); }
        
        .alert-text { 
            font-size: 36px; 
            color: #fff; 
            margin: 0; 
            text-transform: uppercase; 
            text-shadow: 0 0 10px #fff; 
            letter-spacing: 1px;
        }
        
        /* --- DESIGN COLORS --- */
        
        /* 1. Tipper Name: Neon Red */
        .highlight { 
            color: #FF0039; 
            text-shadow: 0 0 20px #FF0039, 0 0 10px #FF0039; 
        } 
        
        /* 2. Amount: Neon Green */
        .amount { 
            color: #39FF14; /* Neon Green */
            font-size: 50px; 
            display: block; 
            margin: 10px 0; 
            text-shadow: 0 0 20px #39FF14, 0 0 10px #39FF14; 
        }
        
        /* 3. Message: White */
        .message { 
            font-size: 24px; 
            color: #FFFFFF; 
            margin-top: 20px; 
            font-weight: normal; 
            font-family: 'Knocky', sans-serif;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        
        .alert-image { 
            width: 100px; 
            height: 100px; 
            border: 3px solid #FF0039; /* Matched border to Red */
            border-radius: 50%; 
            object-fit: cover; 
            box-shadow: 0 0 15px #FF0039; 
        }
    </style>
</head>
<body>
    
    <audio id="notification-sound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3" preload="auto"></audio>

    <div id="alert-box">
        <img id="alert-image" class="alert-image" src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pnaGo1dmYwaTJ4aXVtYjFhZm5jd3RzNTViMmgwdzFiejc3MjZoaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26gsjCZpPolPr3sBy/giphy.gif">
        <h1 class="alert-text">
            <span id="sender" class="highlight">USER</span> <br> 
            JUST DROPPED <br> 
            <span id="amount" class="amount">500</span>
        </h1>
        <p class="message" id="message-text">Message goes here...</p>
    </div>

    <script>
        var socket = io(); 
        var queue = []; 
        var isPlaying = false;
        var availableVoices = [];

        // 1. Force Load Voices
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); 

        // 2. Connection Logic
        var pathParts = window.location.pathname.split('/');
        var uuid = pathParts[pathParts.length - 1]; 
        if (!uuid) uuid = pathParts[pathParts.length - 2];

        if (uuid && uuid !== "overlay") {
            socket.emit('join-overlay', uuid);
        }

        socket.on('new-tip', (data) => { queue.push(data); processQueue(); });

        function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;
            var data = queue.shift();
            startAlertSequence(data);
        }

        // --- 3. SEQUENCE LOGIC (Sound -> Popup -> TTS) ---
        function startAlertSequence(data) {
            var sound = document.getElementById('notification-sound');
            var box = document.getElementById('alert-box');

            // Update Text Before Showing
            var senderName = data.tipper || "Anonymous";
            if(document.getElementById('sender')) document.getElementById('sender').innerText = senderName;
            if(document.getElementById('amount')) document.getElementById('amount').innerText = "₹" + data.amount;
            if(document.getElementById('message-text')) document.getElementById('message-text').innerText = `"${data.message}"`;

            // Step A: Play Sound
            // Reset sound to start (in case it was played before)
            sound.currentTime = 0;
            var playPromise = sound.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // Audio started successfully
                    // We wait for it to end before showing popup
                    sound.onended = function() {
                        showPopupAndSpeak(data, box);
                    };
                }).catch(error => {
                    console.log("Audio play failed (browser blocked?):", error);
                    // Fallback: Skip sound, go straight to popup
                    showPopupAndSpeak(data, box);
                });
            } else {
                 showPopupAndSpeak(data, box);
            }
        }

        function showPopupAndSpeak(data, box) {
            // Step B: Show Popup
            box.classList.add('show');

            // Step C: Wait slightly for animation (0.5s), then Speak
            setTimeout(() => {
                speakTTS(data, box);
            }, 500); 
        }

        function speakTTS(data, box) {
            if (!window.speechSynthesis) {
                setTimeout(() => finishAlert(box), 4000);
                return;
            }

            window.speechSynthesis.cancel();

            var senderName = data.tipper || "Anonymous";
            var cleanMessage = data.message.replace(/[^a-zA-Z0-9 \u0900-\u097F]/g, ""); 
            var textToSpeak = `${senderName} sent ${data.amount} rupees. ${cleanMessage}`;
            
            var utter = new SpeechSynthesisUtterance(textToSpeak);

            // Voice Selection Logic
            var hasHindiScript = /[\u0900-\u097F]/.test(data.message);
            var targetVoice = null;

            if (hasHindiScript) {
                utter.lang = 'hi-IN'; 
                targetVoice = availableVoices.find(v => v.name.includes('Hemant')) || availableVoices.find(v => v.lang.includes('hi'));
            } else {
                utter.lang = 'en-IN'; 
                targetVoice = availableVoices.find(v => v.name.includes('Ravi')) || availableVoices.find(v => v.name.includes('Mark')) || availableVoices.find(v => v.lang.includes('en-IN'));
            }

            if (targetVoice) utter.voice = targetVoice;
            utter.rate = 1.1; 
            
            utter.onend = () => finishAlert(box);
            utter.onerror = (e) => { console.error("TTS Error:", e); finishAlert(box); };
            
            window.speechSynthesis.speak(utter);
        }

        function finishAlert(box) {
            setTimeout(() => { 
                box.classList.remove('show'); 
                setTimeout(() => { isPlaying = false; processQueue(); }, 1000); 
            }, 2000);
        }
    </script>
</body>
</html>
