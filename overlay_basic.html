<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Neon Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* --- FONT SETUP --- */
        @font-face {
            font-family: 'Knocky';
            src: url('Knocky-SemiBold.woff2') format('woff2'),
                 url('Knocky-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }
        
        body { 
            margin: 0; 
            overflow: hidden; 
            background: transparent; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Knocky', sans-serif;
        }
        
        /* --- PREMIUM CARD DESIGN --- */
        #alert-box {
            text-align: center; 
            opacity: 0; 
            transform: translateY(30px) scale(0.9); 
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1); /* smooth pop-up */
            
            /* Premium Dark Glass Background */
            background: linear-gradient(145deg, rgba(30,30,30,0.95) 0%, rgba(0,0,0,0.98) 100%);
            backdrop-filter: blur(10px);
            
            padding: 40px 50px; 
            min-width: 550px;
            border-radius: 20px;
            
            /* Subtle Glass Border + Red Glow */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.8), /* Deep shadow */
                0 0 30px rgba(255, 0, 57, 0.2); /* Soft Red Ambient Glow */
            
            position: relative;
            overflow: hidden;
        }

        /* Glossy Shine on Top */
        #alert-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        }
        
        #alert-box.show { opacity: 1; transform: translateY(0) scale(1); }
        
        /* --- TYPOGRAPHY --- */
        .alert-text { 
            font-size: 32px; 
            color: #fff; 
            margin: 10px 0; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            line-height: 1.3;
        }
        
        /* 1. USER: Neon Red */
        #sender { 
            color: #FF0039; 
            font-size: 42px;
            display: block;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 0, 57, 0.8); 
        } 
        
        /* Helper Text */
        .sub-text {
            font-size: 18px;
            color: #888;
            font-weight: normal;
            vertical-align: middle;
            margin: 0 10px;
        }
        
        /* 2. AMOUNT: Bright Green */
        #amount { 
            color: #00FF00; 
            font-size: 52px; 
            display: inline-block;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.8); 
        }
        
        /* 3. MESSAGE: Bright White */
        .message { 
            font-size: 26px; 
            color: #FFFFFF; 
            margin-top: 25px; 
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1); /* Separator line */
            font-weight: normal; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.4;
        }
        
        /* Image Style */
        .alert-image { 
            width: 110px; 
            height: 110px; 
            border: 4px solid #FF0039; /* Red Border matching User */
            border-radius: 50%; 
            object-fit: cover; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); 
            margin-bottom: 10px;
            margin-top: -60px; /* Pulls image up to overlap the top edge slightly for style */
            background: #000;
        }
        
        /* Spacer to push content down since image is pulled up */
        .spacer { height: 10px; }

    </style>
</head>
<body>

    <div id="alert-box">
        <img id="alert-image" class="alert-image" src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pnaGo1dmYwaTJ4aXVtYjFhZm5jd3RzNTViMmgwdzFiejc3MjZoaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26gsjCZpPolPr3sBy/giphy.gif">
        
        <div class="spacer"></div>

        <div class="alert-text">
            <span id="sender">USER</span>
            <span class="sub-text">SENT</span>
            <span id="amount">₹500</span>
        </div>

        <p class="message" id="message-text">Message goes here...</p>
    </div>

    <script>
        var socket = io(); var queue = []; var isPlaying = false;
        var availableVoices = [];

        function loadVoices() { availableVoices = window.speechSynthesis.getVoices(); }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); 

        var pathParts = window.location.pathname.split('/');
        var uuid = pathParts[pathParts.length - 1]; 
        if (!uuid) uuid = pathParts[pathParts.length - 2];

        if (uuid && uuid !== "overlay") { socket.emit('join-overlay', uuid); }

        socket.on('new-tip', (data) => { queue.push(data); processQueue(); });

        function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;
            var data = queue.shift();
            showAlert(data);
        }

        function showAlert(data) {
            var senderName = data.tipper || "Anonymous";
            document.getElementById('sender').innerText = senderName;
            document.getElementById('amount').innerText = "₹" + data.amount;
            document.getElementById('message-text').innerText = `"${data.message}"`;
            
            var box = document.getElementById('alert-box');
            box.classList.add('show');

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                
                // --- CHANGED HERE: Removed the regex that stripped special chars/emojis ---
                // We now use the raw message so the browser reads emojis (e.g. "Red Heart")
                var messageToSpeak = data.message; 
                
                var utter = new SpeechSynthesisUtterance(`${senderName} sent ${data.amount} rupees. ${messageToSpeak}`);
                
                // Detect Hindi characters to switch voice accent
                var hasHindiScript = /[\u0900-\u097F]/.test(data.message);
                var targetVoice = null;

                if (hasHindiScript) {
                    utter.lang = 'hi-IN'; 
                    targetVoice = availableVoices.find(v => v.name.includes('Hemant')) || availableVoices.find(v => v.lang.includes('hi'));
                } else {
                    utter.lang = 'en-IN'; 
                    targetVoice = availableVoices.find(v => v.name.includes('Ravi')) || availableVoices.find(v => v.lang.includes('en-IN'));
                }
                if (targetVoice) utter.voice = targetVoice;

                utter.onend = () => finishAlert(box);
                utter.onerror = () => finishAlert(box);
                window.speechSynthesis.speak(utter);
            } else { setTimeout(() => finishAlert(box), 4000); }
        }
        function finishAlert(box) {
            setTimeout(() => { box.classList.remove('show'); setTimeout(() => { isPlaying = false; processQueue(); }, 1000); }, 2000);
        }
    </script>
</body>
</html>
