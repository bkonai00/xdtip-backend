<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stats Rotator</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@500;900&display=swap');
        
        body { 
            margin: 0; padding: 20px; 
            overflow: hidden; 
            background: transparent; 
            font-family: 'Roboto', sans-serif; 
        }

        /* --- CONTAINER --- */
        #stats-container {
            width: 320px;
            background: rgba(0, 0, 0, 0.9);
            border-left: 5px solid #FFD700; /* Gold Border */
            border-radius: 0 10px 10px 0;
            padding: 15px;
            color: white;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }

        /* --- ROTATOR SECTION (Blinking) --- */
        .rotator-box {
            display: flex; align-items: center; justify-content: space-between;
            min-height: 50px;
        }

        .label {
            font-size: 11px; color: #888; letter-spacing: 1px;
            text-transform: uppercase; font-weight: 700; margin-bottom: 5px;
        }

        .tipper-name {
            font-size: 24px; font-weight: 900; 
            color: #FFD700; /* Gold Text */
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 200px;
            opacity: 0; /* Start hidden for animation */
            transition: opacity 0.5s ease-in-out;
        }
        
        .tipper-amount {
            font-size: 20px; color: #fff; font-weight: bold;
            opacity: 0; /* Start hidden */
            transition: opacity 0.5s ease-in-out;
        }

        /* Class to trigger fade in */
        .visible { opacity: 1 !important; }

        /* RANK BADGE (#1, #2, #3) */
        .rank-badge {
            background: #333; color: #aaa; padding: 2px 6px;
            border-radius: 4px; font-size: 12px; margin-right: 8px;
            vertical-align: middle;
        }

        /* --- LATEST LIST (Below) --- */
        .divider { height: 1px; background: #333; margin: 15px 0; }
        .latest-list { list-style: none; padding: 0; margin: 0; }
        .latest-item { 
            display: flex; justify-content: space-between; 
            font-size: 14px; margin-bottom: 6px; 
            color: #ccc; 
        }
        .latest-amt { color: #00ffcc; font-weight: bold; }

    </style>
</head>
<body>

    <div id="stats-container">
        
        <div class="label">🏆 TOP SUPPORTERS</div>
        <div class="rotator-box">
            <div style="display:flex; align-items:center;">
                <span id="rank" class="rank-badge">#1</span>
                <span id="rotator-name" class="tipper-name">Loading...</span>
            </div>
            <span id="rotator-amount" class="tipper-amount">₹0</span>
        </div>

        <div class="divider"></div>

        <div class="label">⚡ RECENT TIPS</div>
        <ul id="latest-list" class="latest-list">
            </ul>
    </div>

    <script>
        var socket = io(); 
        var topTippers = []; // Array to store Top 3
        var currentIndex = 0;
        
        // 1. GET UUID
        var pathParts = window.location.pathname.split('/');
        var uuid = pathParts[pathParts.length - 1]; 

        if (uuid) {
            socket.emit('join-overlay', uuid);
            fetchStats();
        }

        // 2. FETCH DATA
        async function fetchStats() {
            try {
                const res = await fetch(`/stats/${uuid}`);
                const data = await res.json();

                // Store Top 3 Data
                topTippers = data.top; 
                
                // Start Rotation Loop if we have data
                if (topTippers.length > 0) {
                    showNextTipper();
                    setInterval(showNextTipper, 3000); // Change every 3 seconds
                } else {
                    document.getElementById('rotator-name').innerText = "No tips yet";
                    document.getElementById('rotator-name').classList.add('visible');
                    document.getElementById('rotator-amount').classList.add('visible');
                }

                // Update Latest List
                updateLatestList(data.latest);

            } catch(e) { console.error(e); }
        }

        // 3. ROTATION LOGIC (The Blink Effect)
        function showNextTipper() {
            if (topTippers.length === 0) return;

            var nameEl = document.getElementById('rotator-name');
            var amtEl = document.getElementById('rotator-amount');
            var rankEl = document.getElementById('rank');

            // 1. Fade Out
            nameEl.classList.remove('visible');
            amtEl.classList.remove('visible');

            // 2. Wait 500ms (Fade Out Time), Then Change Text & Fade In
            setTimeout(() => {
                var tipper = topTippers[currentIndex];
                
                nameEl.innerText = tipper.sender_name || "Anonymous";
                amtEl.innerText = "₹" + tipper.amount;
                rankEl.innerText = "#" + (currentIndex + 1);

                // Fade In
                nameEl.classList.add('visible');
                amtEl.classList.add('visible');

                // Prepare next index
                currentIndex++;
                if (currentIndex >= topTippers.length) currentIndex = 0;

            }, 500); 
        }

        // 4. LATEST LIST HELPER
        function updateLatestList(latestData) {
            var list = document.getElementById('latest-list');
            list.innerHTML = "";
            latestData.forEach(t => {
                var li = document.createElement('li');
                li.className = "latest-item";
                li.innerHTML = `<span>${t.sender_name || 'Anon'}</span> <span class="latest-amt">₹${t.amount}</span>`;
                list.appendChild(li);
            });
        }

        // 5. LIVE UPDATE LISTENER
        socket.on('new-tip', (data) => {
            // Re-fetch everything to ensure Top 3 ranking is accurate
            fetchStats();
        });

    </script>
</body>
</html>
